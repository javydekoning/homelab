apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-crowdsec-secret
  namespace: crowdsec
  annotations:
    # Bump to make ESO re-read AWS immediately after adding keys
    force-sync: "2026-10-25-enroll-key"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: crowdsec-secrets
  dataFrom:
    - extract:
        key: k8s-homelab-secrets
        property: crowdsec
# Expected keys in the "crowdsec" property of k8s-homelab-secrets:
# - csLapiSecret: LAPI JWT signing secret (>64 chars)
# - registrationToken: agent auto-registration token (>48 chars)
# - BOUNCER_KEY_traefik: API key for the traefik-external bouncer (phase 2)
# - ENROLL_KEY: CrowdSec Console enrollment key
#
# These must come from a secret: the chart generates them with rand/lookup,
# which doesn't work with kustomize helmCharts and would rotate on every render.
