apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metallb-system

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.2
    releaseName: metallb
    namespace: metallb-system
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - l2advertisement.yaml
  - ip-pool.yaml
  - ns.yaml

patches:
  # statuscleaner uses hostNetwork + hostPort 19443. On a single node the default
  # RollingUpdate (maxUnavailable rounds to 0) deadlocks: new pod can't bind the port
  # while the old one holds it. Chart exposes no strategy value for this Deployment.
  - target:
      kind: Deployment
      name: metallb-frr-k8s-statuscleaner
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
