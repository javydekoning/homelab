ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: trivy.k8s.javydekoning.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 384Mi

image:
  pullPolicy: IfNotPresent

history:
  distributedCache:
    sidecar:
      pvc:
        # nvme-local-path has a malformed pathPattern and cannot dynamically
        # provision; this is a disposable valkey cache, so use the default class.
        storageClassName: local-path
