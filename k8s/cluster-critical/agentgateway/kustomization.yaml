apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system

helmCharts:
  # CRDs first: AgentgatewayBackend/Policy/Parameters. The controller creates
  # the `agentgateway` GatewayClass at runtime once it is up.
  - name: agentgateway-crds
    repo: oci://cr.agentgateway.dev/charts
    version: v1.7.0
    releaseName: agentgateway-crds
    namespace: agentgateway-system
    includeCRDs: true
  - name: agentgateway
    repo: oci://cr.agentgateway.dev/charts
    version: v1.7.0
    releaseName: agentgateway
    namespace: agentgateway-system
    valuesFile: values.yaml
    includeCRDs: true

resources:
  # Gateway API CRDs (Gateway, GatewayClass, HTTPRoute, ...) are NOT managed here:
  # k3s ships them via its bundled `gateway-api-crd` HelmChart (kube-system) and
  # upgrades them with k3s. Installing an older bundle here gets denied by the
  # safe-upgrades ValidatingAdmissionPolicy.
  - ns.yaml
