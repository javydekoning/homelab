apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homer
    app.kubernetes.io/name: homer
  name: homer
  namespace: homer
spec:
  selector:
    matchLabels:
      app: homer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homer
        app.kubernetes.io/name: homer
    spec:
      containers:
        - name: homer
          env:
            - name: TZ
              value: Europe/Amsterdam
          image: b4bz/homer:latest@sha256:83e40d1b7c9d4be4b9b9081e7151543ceb081576301b33b38615ae3f1d6b3e92
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - localhost:8080
                - -O
                - /dev/null
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - localhost:8080
                - -O
                - /dev/null
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /www/assets/config.yml
              name: config
              subPath: config.yml
            - mountPath: /www/assets/catppuccin-mocha.css
              name: config
              subPath: catppuccin-mocha.css
      restartPolicy: Always
      volumes:
        - configMap:
            defaultMode: 420
            name: homer-config
          name: config
