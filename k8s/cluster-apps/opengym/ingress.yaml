apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opengym
  namespace: opengym
  labels:
    app: opengym
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - opengym.k8s.javydekoning.com
  rules:
    - host: opengym.k8s.javydekoning.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opengym
                port:
                  name: http
