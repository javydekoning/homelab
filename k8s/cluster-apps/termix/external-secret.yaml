apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-termix-secret
  namespace: termix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: termix-credentials
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: k8s-homelab-secrets
        property: termix
