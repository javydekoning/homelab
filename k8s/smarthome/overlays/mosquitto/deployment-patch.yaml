apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      containers:
        - name: app
          securityContext:
            privileged: true
          ports:
            - name: websockets
              containerPort: 9001
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: persistence
              mountPath: /mosquitto/data
              subPath: mosquitto
            - name: config
              mountPath: /mosquitto/config/
            - name: log
              mountPath: /mosquitto/log
      volumes:
        - name: config
          configMap:
            name: mosquitto-configmap
        - name: log
          emptyDir: {}
