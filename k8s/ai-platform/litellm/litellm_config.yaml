model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/mantle/anthropic.claude-opus-5
      aws_region_name: eu-west-1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      # aws_bedrock_project_id is emitted by LiteLLM as the wrong header
      # ("anthropic-workspace" instead of "anthropic-workspace-id"), so Mantle
      # ignores it and bills the default project. See BerriAI/litellm#31947.
      # Send the correct header explicitly until the upstream fix ships.
    model_info:
      supports_vision: True
  - model_name: nutritrace-default
    litellm_params:
      model: bedrock/mantle/anthropic.claude-sonnet-5
      aws_region_name: eu-west-1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      #aws_bedrock_project_id: proj_6ndw24kw5sktspomktbl
    model_info:
      supports_vision: True
  - model_name: claude-opus-latest
    litellm_params:
      model: os.environ/CLAUDE_OPUS_LATEST_INF_ARN
      aws_region_name: eu-west-1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      requestMetadata:
        Application: "LiteLLM"
  - model_name: claude-sonnet-latest
    litellm_params:
      model: os.environ/CLAUDE_SONNET_LATEST_INF_ARN
      aws_region_name: eu-west-1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      requestMetadata:
        Application: "LiteLLM"
  - model_name: claude-haiku-latest
    litellm_params:
      model: os.environ/CLAUDE_HAIKU_LATEST_INF_ARN
      aws_region_name: eu-west-1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      requestMetadata:
        Application: "LiteLLM"
    model_info:
      supports_vision: True
  - model_name: amazon-nova-lite
    litellm_params:
      model: os.environ/NOVA_LITE_INF_ARN
      aws_region_name: eu-west-1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      requestMetadata:
        Application: "LiteLLM"

router_settings:
  fallbacks: [{"nutritrace-default": ["claude-opus-5","claude-haiku-latest"]}]
