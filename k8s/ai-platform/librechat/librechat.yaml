# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.3.0

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  # MCP Servers UI configuration
  mcpServers:
    placeholder: "MCP Servers"

# All MCP servers are federated by the agentgateway MCP gateway
# (see k8s/ai-platform/mcp-gateway/). LibreChat no longer hosts any itself.
mcpServers:
  mcp_gateway:
    type: streamable-http
    url: "http://mcp-gateway.mcp-gateway.svc.cluster.local/mcp"

# LibreChat's SSRF protection blocks private hostnames by default; exempt the
# in-cluster gateway (resolves to a private ClusterIP on port 80).
mcpSettings:
  allowedAddresses:
    - "mcp-gateway.mcp-gateway.svc.cluster.local:80"

# Example Registration Object Structure (optional)
registration:
  socialLogins: ["openid"]
  allowedDomains:
    - "javydekoning.com"

# Definition of custom endpoints
endpoints:
  agents:
    disableBuilder: false
  custom:
    - name: "LiteLLM"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "http://litellm.litellm.svc.cluster.local:4000/v1"
      iconURL: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/litellm.svg"
      models:
        default: ["anthropic-claude-haiku-v4.5"]
        fetch: true
      titleConvo: true
      titleModel: "anthropic-claude-haiku-v4.5"
      forcePrompt: false
