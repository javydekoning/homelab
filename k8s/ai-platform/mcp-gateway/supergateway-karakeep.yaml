apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-karakeep
  labels:
    app: mcp-karakeep
    app.kubernetes.io/name: mcp-karakeep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-karakeep
  template:
    metadata:
      labels:
        app: mcp-karakeep
        app.kubernetes.io/name: mcp-karakeep
    spec:
      containers:
        - name: mcp-proxy
          # Migrated off supercorp/supergateway: unmaintained + confirmed memory leak.
          # karakeep/mcp has no native streamable-http transport (tracked upstream:
          # https://github.com/karakeep-app/karakeep/issues/1965), so we still need a
          # stdio->HTTP bridge. mcp-proxy (sparfenyuk/mcp-proxy) is the actively
          # maintained alternative; mcpo and mcp-remote were ruled out (mcpo stalled,
          # mcp-remote runs the opposite direction - HTTP->stdio, not what we need).
          image: ghcr.io/sparfenyuk/mcp-proxy:latest
          args:
            - "--port=8000"
            - "--host=0.0.0.0"
            - "--"
            - "npx"
            - "-y"
            - "@karakeep/mcp"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          env:
            # Talk to Karakeep in-cluster rather than via the external ingress.
            - name: KARAKEEP_API_ADDR
              value: http://karakeep.karakeep.svc.cluster.local:3000
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secret
                  key: KARAKEEP_API_KEY
          ports:
            - containerPort: 8000
              name: mcp
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-karakeep
  labels:
    app: mcp-karakeep
spec:
  type: ClusterIP
  selector:
    app: mcp-karakeep
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
      protocol: TCP
      # Tells agentgateway this Service speaks MCP (streamable HTTP).
      appProtocol: agentgateway.dev/mcp
