apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-mcp-gateway-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: mcp-gateway-secret
    template:
      engineVersion: v2
      data:
        # Consumed by the AgentgatewayBackend home-assistant target via
        # policies.auth.secretRef (default resolver reads the "Authorization" key).
        Authorization: "Bearer {{ .HASS_API_KEY }}"
        # Consumed by the karakeep SuperGateway Deployment.
        KARAKEEP_API_KEY: "{{ .KARAKEEP_API_KEY }}"
  data:
    - secretKey: HASS_API_KEY
      remoteRef:
        key: k8s-homelab-secrets
        property: litellm.HASS_API_KEY
    - secretKey: KARAKEEP_API_KEY
      remoteRef:
        key: k8s-homelab-secrets
        property: karakeep.KARAKEEP_API_KEY_MCPO
