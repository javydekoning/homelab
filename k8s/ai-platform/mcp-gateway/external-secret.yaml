apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-mcp-gateway-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: mcp-gateway-secret
    template:
      engineVersion: v2
      data:
        # nginx snippet mounted by the mcp-home-assistant proxy Deployment. The
        # Home Assistant MCP webhook id is itself the credential, so it cannot
        # live in backend.yaml; only its path is rendered here and the request
        # is sent to Home Assistant in-cluster instead of via the ingress.
        HA_MCP_UPSTREAM_CONF: |
          proxy_pass http://home-assistant.home-assistant.svc.cluster.local:8123{{ (urlParse (.HA_MCP_URL | toString)).path }};
        # Consumed by the karakeep SuperGateway Deployment.
        KARAKEEP_API_KEY: "{{ .KARAKEEP_API_KEY }}"
        # Consumed by the AgentgatewayBackend nutritrace target via
        # policies.auth.secretRef.key. Stored raw: the gateway adds the
        # "Bearer " prefix itself for non-Authorization keys.
        NUTRITRACE_MCP_API_KEY: "{{ .NUTRITRACE_MCP_API_KEY }}"
  data:
    - secretKey: HA_MCP_URL
      remoteRef:
        key: k8s-homelab-secrets
        property: mcpgateway.HA_MCP_URL
    - secretKey: KARAKEEP_API_KEY
      remoteRef:
        key: k8s-homelab-secrets
        property: litellm.KARAKEEP_API_KEY
    - secretKey: NUTRITRACE_MCP_API_KEY
      remoteRef:
        key: k8s-homelab-secrets
        property: nutritrace.mcp_api_key
