apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freshrss
resources:
  - ns.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - external-secret.yaml
configMapGenerator:
  - name: freshrss-config
    envs:
      - freshrss.env
  - name: freshrss-theme
    files:
      - theme/metadata.json
      - theme/frss.css
      - theme/nord.css
      - theme/catppuccin-mocha.css
